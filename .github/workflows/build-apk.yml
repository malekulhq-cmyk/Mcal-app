name: Build Calculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # 1. Download project
      - name: Checkout
        uses: actions/checkout@v4


      # 2. Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # 3. Python 3.11
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # 4. Linux dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev


      # 5. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true


      # 6. Android SDK packages
      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses || true


      # 7. Check Android SDK
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "sdkmanager:"
          which sdkmanager

          echo "sdkmanager version:"
          sdkmanager --version

          echo "ADB:"
          adb version


      # 8. Check AIDL
      - name: Check AIDL
        run: |
          echo "Checking AIDL..."

          test -f "$ANDROID_SDK_ROOT/build-tools/35.0.0/aidl"

          echo "AIDL found successfully:"
          ls -lh "$ANDROID_SDK_ROOT/build-tools/35.0.0/aidl"


      # 9. Install Buildozer
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          pip install buildozer
          pip install cython==0.29.37


      # 10. Remove old Buildozer cache
      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf bin


      # 11. Build APK
      - name: Build Calculator APK
        run: |
          buildozer android debug


      # 12. Upload APK
      - name: Upload Calculator APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-APK
          path: bin/*.apk
          if-no-files-found: error
