name: Build Calculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # 1. Get repository code
      - name: Checkout
        uses: actions/checkout@v4


      # 2. Setup Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # 3. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # 4. Install system dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev


      # 5. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # 6. Accept ALL Android SDK licenses
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          echo "All Android SDK licenses accepted."


      # 7. Install Android SDK packages
      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK packages installed."


      # 8. Show Android SDK information
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          which sdkmanager
          sdkmanager --version

          adb version


      # 9. Install Buildozer
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          pip install buildozer
          pip install cython==0.29.37


      # 10. Build Calculator APK
      - name: Build Calculator APK
        run: |
          buildozer android debug


      # 11. Upload APK
      - name: Upload Calculator APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-APK
          path: bin/*.apk
          if-no-files-found: error
