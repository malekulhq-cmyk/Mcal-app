name: Build Calculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      # -------------------------
      # Checkout
      # -------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # -------------------------
      # Java
      # -------------------------

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # -------------------------
      # Python
      # -------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # -------------------------
      # Linux dependencies
      # -------------------------

      - name: Install system dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev


      # -------------------------
      # Android SDK
      # -------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0


      # -------------------------
      # Fix old Buildozer SDK path
      # -------------------------

      - name: Fix Buildozer sdkmanager path
        run: |

          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "Searching sdkmanager..."

          find "$ANDROID_SDK_ROOT" \
            -name sdkmanager \
            -type f \
            -print

          echo ""
          echo "Creating old Buildozer path..."

          mkdir -p "$ANDROID_SDK_ROOT/tools/bin"

          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
            -name sdkmanager \
            -type f \
            | head -n 1)

          echo "Found sdkmanager:"
          echo "$SDKMANAGER"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found!"
            exit 1
          fi

          ln -sf "$SDKMANAGER" \
            "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"

          chmod +x "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"

          echo ""
          echo "Checking Buildozer sdkmanager..."

          ls -lh \
            "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"

          echo ""
          echo "sdkmanager version:"

          "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" --version


      # -------------------------
      # Check Android SDK
      # -------------------------

      - name: Check Android SDK
        run: |

          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""

          echo "SDK manager:"

          which sdkmanager

          sdkmanager --version

          echo ""

          echo "Build Tools:"

          ls -la "$ANDROID_SDK_ROOT/build-tools"

          echo ""

          echo "AIDL:"

          ls -lh \
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/aidl"


      # -------------------------
      # Install Buildozer
      # -------------------------

      - name: Install Buildozer
        run: |

          python -m pip install --upgrade pip

          python -m pip install --upgrade \
            setuptools \
            wheel

          pip install buildozer

          pip install cython==0.29.37


      # -------------------------
      # Clean old build
      # -------------------------

      - name: Clean Build
        run: |

          rm -rf .buildozer

          rm -rf bin


      # -------------------------
      # Build APK
      # -------------------------

      - name: Build Calculator APK
        run: |

          buildozer android debug


      # -------------------------
      # Upload APK
      # -------------------------

      - name: Upload Calculator APK
        uses: actions/upload-artifact@v4

        with:

          name: Calculator-APK

          path: bin/*.apk

          if-no-files-found: error
