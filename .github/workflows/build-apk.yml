name: Build Calculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # -----------------------------
      # 1. Get project files
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # -----------------------------
      # 2. Java 17
      # -----------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # -----------------------------
      # 3. Python 3.11
      # -----------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # -----------------------------
      # 4. Linux dependencies
      # -----------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev


      # -----------------------------
      # 5. Android SDK
      # -----------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0


      # -----------------------------
      # 6. Check Android SDK
      # -----------------------------
      - name: Check Android SDK
        run: |
          echo "================================"
          echo "ANDROID_HOME"
          echo "$ANDROID_HOME"
          echo "================================"

          echo "ANDROID_SDK_ROOT"
          echo "$ANDROID_SDK_ROOT"
          echo "================================"

          echo "SDKMANAGER"
          which sdkmanager
          sdkmanager --version
          echo "================================"

          echo "Android SDK folders:"
          ls -la "$ANDROID_SDK_ROOT"

          echo "================================"
          echo "Build Tools:"
          ls -la "$ANDROID_SDK_ROOT/build-tools"

          echo "================================"
          echo "AIDL:"
          ls -lh "$ANDROID_SDK_ROOT/build-tools/35.0.0/aidl"


      # -----------------------------
      # 7. Install Buildozer
      # -----------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          pip install buildozer

          pip install cython==0.29.37


      # -----------------------------
      # 8. Clean old Buildozer files
      # -----------------------------
      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin


      # -----------------------------
      # 9. Build APK
      # -----------------------------
      - name: Build Calculator APK
        run: |
          buildozer android debug


      # -----------------------------
      # 10. Upload APK
      # -----------------------------
      - name: Upload Calculator APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-APK
          path: bin/*.apk
          if-no-files-found: error
